server {
    listen 80;
    server_name _;

    # Forward all requests to the iii engine HTTP API
    # In docker-compose: iii-engine resolves via Docker DNS
    # On AWS:            replace iii-engine with vm-engine private IP (10.0.2.10)
    location / {
        proxy_pass         http://iii-engine:3111;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Increase timeout for slow inference responses
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
